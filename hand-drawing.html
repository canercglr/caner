<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cizimi Video Olusturucu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #f39c12, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .upload-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .upload-btn {
            background: linear-gradient(135deg, #e94560, #c62a4a);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .file-name {
            color: #888;
            font-size: 0.9rem;
        }

        .image-preview-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        .image-preview-section h3 {
            color: #2ecc71;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .image-preview {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            border: 2px solid #2ecc71;
            object-fit: contain;
        }

        .controls {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.9rem;
            color: #ccc;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
        }

        .control-group input[type="color"] {
            width: 50px;
            height: 35px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .control-group select {
            padding: 8px;
            border-radius: 5px;
            border: none;
            background: #333;
            color: #fff;
            cursor: pointer;
        }

        .control-group span {
            font-size: 0.85rem;
            color: #f39c12;
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mainCanvas {
            max-width: 100%;
            display: none;
        }

        .placeholder {
            color: #666;
            font-size: 1.2rem;
            text-align: center;
            padding: 50px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-primary:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
        }

        .btn-secondary:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(155, 89, 182, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-danger:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4);
        }

        .progress-container {
            margin-bottom: 25px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #f39c12, #2ecc71);
            width: 0%;
            transition: width 0.1s;
        }

        #progressText {
            color: #f39c12;
            font-weight: bold;
        }

        .download-section {
            background: rgba(46, 204, 113, 0.1);
            border: 2px solid #2ecc71;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .download-section h3 {
            color: #2ecc71;
            margin-bottom: 15px;
        }

        #videoPreview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .hand-cursor {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            transform: translate(-5px, -35px);
            z-index: 100;
            display: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .upload-section {
                flex-direction: column;
            }

            .button-group {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>El Cizimi Video Olusturucu</h1>
        <p class="subtitle">Resminizi yukleyin, sanki bir el ciziyormus gibi animasyon olusturun!</p>

        <div class="upload-section">
            <label for="imageInput" class="upload-btn">
                Resim Sec
            </label>
            <input type="file" id="imageInput" accept="image/*" hidden>
            <span id="fileName" class="file-name">Henuz dosya secilmedi</span>
        </div>

        <div id="imagePreviewSection" class="image-preview-section" hidden>
            <h3>Secilen Resim:</h3>
            <img id="imagePreview" class="image-preview" alt="Secilen resim">
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="drawStyle">Cizim Stili:</label>
                <select id="drawStyle">
                    <option value="outline">Kenar Cizimi</option>
                    <option value="sketch">Karakalem</option>
                    <option value="paint">Boyama</option>
                    <option value="full">Tam Cizim (Kenar + Renk)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="lineWidth">Cizgi Kalinligi:</label>
                <input type="range" id="lineWidth" min="1" max="5" value="2">
                <span id="lineWidthValue">2px</span>
            </div>

            <div class="control-group">
                <label for="speed">Cizim Hizi:</label>
                <input type="range" id="speed" min="1" max="50" value="10">
                <span id="speedValue">10</span>
            </div>

            <div class="control-group">
                <label for="fps">FPS:</label>
                <input type="range" id="fps" min="10" max="60" value="30">
                <span id="fpsValue">30</span>
            </div>

            <div class="control-group">
                <label for="edgeThreshold">Kenar Hassasiyeti:</label>
                <input type="range" id="edgeThreshold" min="5" max="100" value="20">
                <span id="edgeThresholdValue">20</span>
            </div>

            <div class="control-group">
                <label for="bgColor">Arka Plan:</label>
                <input type="color" id="bgColor" value="#ffffff">
            </div>

            <div class="control-group">
                <label for="penColor">Kalem Rengi:</label>
                <input type="color" id="penColor" value="#333333">
            </div>

            <div class="control-group">
                <label for="showHand">El Goster:</label>
                <select id="showHand">
                    <option value="yes">Evet</option>
                    <option value="no">Hayir</option>
                </select>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="mainCanvas"></canvas>
            <!-- El/Kalem SVG -->
            <svg id="handCursor" class="hand-cursor" viewBox="0 0 50 50">
                <g transform="rotate(-30, 25, 40)">
                    <!-- Kalem govdesi -->
                    <rect x="22" y="5" width="6" height="35" fill="#f4d03f" stroke="#333" stroke-width="1"/>
                    <!-- Kalem ucu -->
                    <polygon points="22,40 28,40 25,50" fill="#333"/>
                    <!-- Kalem silgisi -->
                    <rect x="22" y="2" width="6" height="5" fill="#e74c3c" stroke="#333" stroke-width="1"/>
                </g>
            </svg>
            <div id="placeholder" class="placeholder">
                <span>Yukaridan bir resim secin</span>
            </div>
        </div>

        <div class="button-group">
            <button id="previewBtn" class="btn btn-secondary" disabled>
                Onizleme
            </button>
            <button id="recordBtn" class="btn btn-primary" disabled>
                Video Olustur
            </button>
            <button id="stopBtn" class="btn btn-danger" disabled>
                Durdur
            </button>
        </div>

        <div id="progress" class="progress-container" hidden>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <span id="progressText">0%</span>
        </div>

        <div id="downloadSection" class="download-section" hidden>
            <h3>Video Hazir!</h3>
            <video id="videoPreview" controls></video>
            <br><br>
            <a id="downloadBtn" class="btn btn-success" download="hand-drawing.webm">
                Videoyu Indir
            </a>
        </div>
    </div>

    <script>
        // DOM Elements
        const imageInput = document.getElementById('imageInput');
        const fileName = document.getElementById('fileName');
        const drawStyleSelect = document.getElementById('drawStyle');
        const lineWidthSlider = document.getElementById('lineWidth');
        const lineWidthValue = document.getElementById('lineWidthValue');
        const speedSlider = document.getElementById('speed');
        const speedValue = document.getElementById('speedValue');
        const fpsSlider = document.getElementById('fps');
        const fpsValue = document.getElementById('fpsValue');
        const edgeThresholdSlider = document.getElementById('edgeThreshold');
        const edgeThresholdValue = document.getElementById('edgeThresholdValue');
        const bgColorInput = document.getElementById('bgColor');
        const penColorInput = document.getElementById('penColor');
        const showHandSelect = document.getElementById('showHand');
        const mainCanvas = document.getElementById('mainCanvas');
        const placeholder = document.getElementById('placeholder');
        const handCursor = document.getElementById('handCursor');
        const previewBtn = document.getElementById('previewBtn');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const progressContainer = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const downloadSection = document.getElementById('downloadSection');
        const videoPreview = document.getElementById('videoPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const imagePreviewSection = document.getElementById('imagePreviewSection');
        const imagePreviewImg = document.getElementById('imagePreview');

        const ctx = mainCanvas.getContext('2d');

        // State
        let originalImage = null;
        let originalImageData = null;
        let edgePoints = [];
        let strokePaths = [];
        let isAnimating = false;
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let animationFrameId = null;

        // Update slider display values
        lineWidthSlider.addEventListener('input', () => {
            lineWidthValue.textContent = `${lineWidthSlider.value}px`;
        });

        speedSlider.addEventListener('input', () => {
            speedValue.textContent = speedSlider.value;
        });

        fpsSlider.addEventListener('input', () => {
            fpsValue.textContent = fpsSlider.value;
        });

        edgeThresholdSlider.addEventListener('input', () => {
            edgeThresholdValue.textContent = edgeThresholdSlider.value;
        });

        // Sobel edge detection with improved sensitivity
        function detectEdges(imageData) {
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            // Lower threshold = more edges detected
            const threshold = parseInt(edgeThresholdSlider.value) * 0.5;

            // Convert to grayscale with Gaussian blur to reduce noise
            const gray = new Float32Array(width * height);
            for (let i = 0; i < width * height; i++) {
                const idx = i * 4;
                gray[i] = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
            }

            // Simple 3x3 Gaussian blur
            const blurred = new Float32Array(width * height);
            const gaussKernel = [1, 2, 1, 2, 4, 2, 1, 2, 1];
            const gaussSum = 16;

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    let sum = 0;
                    let ki = 0;
                    for (let ky = -1; ky <= 1; ky++) {
                        for (let kx = -1; kx <= 1; kx++) {
                            sum += gray[(y + ky) * width + (x + kx)] * gaussKernel[ki++];
                        }
                    }
                    blurred[y * width + x] = sum / gaussSum;
                }
            }

            // Sobel kernels
            const sobelX = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
            const sobelY = [-1, -2, -1, 0, 0, 0, 1, 2, 1];

            const edges = [];

            for (let y = 2; y < height - 2; y++) {
                for (let x = 2; x < width - 2; x++) {
                    let gx = 0, gy = 0;

                    for (let ky = -1; ky <= 1; ky++) {
                        for (let kx = -1; kx <= 1; kx++) {
                            const idx = (y + ky) * width + (x + kx);
                            const kernelIdx = (ky + 1) * 3 + (kx + 1);
                            gx += blurred[idx] * sobelX[kernelIdx];
                            gy += blurred[idx] * sobelY[kernelIdx];
                        }
                    }

                    const magnitude = Math.sqrt(gx * gx + gy * gy);

                    if (magnitude > threshold) {
                        edges.push({ x, y, magnitude, angle: Math.atan2(gy, gx) });
                    }
                }
            }

            console.log('Edges detected with threshold', threshold, ':', edges.length);
            return edges;
        }

        // Connect edge points into strokes with improved algorithm
        function createStrokes(edges) {
            if (edges.length === 0) return [];

            const strokes = [];
            const used = new Set();
            const maxDistance = 5; // Increased for better connectivity

            // Create a spatial index for faster neighbor lookup
            const cellSize = maxDistance;
            const grid = new Map();

            for (let i = 0; i < edges.length; i++) {
                const cellX = Math.floor(edges[i].x / cellSize);
                const cellY = Math.floor(edges[i].y / cellSize);
                const key = `${cellX},${cellY}`;
                if (!grid.has(key)) grid.set(key, []);
                grid.get(key).push(i);
            }

            // Get neighbors from spatial index
            function getNeighbors(x, y) {
                const neighbors = [];
                const cellX = Math.floor(x / cellSize);
                const cellY = Math.floor(y / cellSize);

                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        const key = `${cellX + dx},${cellY + dy}`;
                        if (grid.has(key)) {
                            neighbors.push(...grid.get(key));
                        }
                    }
                }
                return neighbors;
            }

            // Sort edges by position for better stroke creation
            const sortedIndices = Array.from({ length: edges.length }, (_, i) => i)
                .sort((a, b) => edges[a].y - edges[b].y || edges[a].x - edges[b].x);

            for (const startIdx of sortedIndices) {
                if (used.has(startIdx)) continue;

                const stroke = [edges[startIdx]];
                used.add(startIdx);

                let current = edges[startIdx];
                let foundNext = true;

                // Forward trace using spatial index
                while (foundNext) {
                    foundNext = false;
                    let bestIdx = -1;
                    let bestDist = maxDistance + 1;

                    const neighbors = getNeighbors(current.x, current.y);
                    for (const j of neighbors) {
                        if (used.has(j)) continue;

                        const dx = edges[j].x - current.x;
                        const dy = edges[j].y - current.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < bestDist && dist <= maxDistance && dist > 0) {
                            bestDist = dist;
                            bestIdx = j;
                        }
                    }

                    if (bestIdx !== -1) {
                        stroke.push(edges[bestIdx]);
                        used.add(bestIdx);
                        current = edges[bestIdx];
                        foundNext = true;
                    }
                }

                // Keep shorter strokes too (minimum 3 points)
                if (stroke.length >= 3) {
                    strokes.push(stroke);
                }
            }

            // Sort strokes by starting position for more natural drawing order
            strokes.sort((a, b) => {
                const aStart = a[0];
                const bStart = b[0];
                return aStart.y - bStart.y || aStart.x - bStart.x;
            });

            console.log('Total strokes created:', strokes.length, 'from', edges.length, 'edge points');
            return strokes;
        }

        // Create sketch-style strokes (hatching effect)
        function createSketchStrokes(imageData) {
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            const strokes = [];

            // Convert to grayscale
            const gray = [];
            for (let y = 0; y < height; y++) {
                gray[y] = [];
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    gray[y][x] = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
                }
            }

            const spacing = 4;

            // Diagonal hatching based on darkness
            for (let y = 0; y < height; y += spacing) {
                for (let x = 0; x < width; x += spacing) {
                    const brightness = gray[y][x];
                    const darkness = 255 - brightness;

                    if (darkness > 50) {
                        const length = Math.floor(darkness / 25);
                        const stroke = [];

                        for (let i = 0; i < length && x + i < width && y + i < height; i++) {
                            stroke.push({ x: x + i, y: y + i });
                        }

                        if (stroke.length > 2) {
                            strokes.push(stroke);
                        }
                    }
                }
            }

            // Cross-hatching for darker areas
            for (let y = 0; y < height; y += spacing) {
                for (let x = width - 1; x >= 0; x -= spacing) {
                    const brightness = gray[y] ? gray[y][x] : 255;
                    const darkness = 255 - brightness;

                    if (darkness > 150) {
                        const length = Math.floor((darkness - 100) / 30);
                        const stroke = [];

                        for (let i = 0; i < length && x - i >= 0 && y + i < height; i++) {
                            stroke.push({ x: x - i, y: y + i });
                        }

                        if (stroke.length > 2) {
                            strokes.push(stroke);
                        }
                    }
                }
            }

            return strokes;
        }

        // Create paint-style strokes (colored regions)
        function createPaintStrokes(imageData) {
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            const strokes = [];
            const brushSize = 8;

            // Create horizontal brush strokes
            for (let y = 0; y < height; y += brushSize) {
                let stroke = [];
                let lastColor = null;

                for (let x = 0; x < width; x += 2) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const color = `rgb(${r},${g},${b})`;

                    if (lastColor === null || color === lastColor) {
                        stroke.push({ x, y, color, r, g, b });
                        lastColor = color;
                    } else {
                        if (stroke.length > 3) {
                            strokes.push([...stroke]);
                        }
                        stroke = [{ x, y, color, r, g, b }];
                        lastColor = color;
                    }
                }

                if (stroke.length > 3) {
                    strokes.push(stroke);
                }
            }

            return strokes;
        }

        // Handle image upload
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileName.textContent = file.name;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;

                    // Show image preview
                    imagePreviewImg.src = event.target.result;
                    imagePreviewSection.hidden = false;

                    // Limit canvas size for performance
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.floor(height * maxDim / width);
                            width = maxDim;
                        } else {
                            width = Math.floor(width * maxDim / height);
                            height = maxDim;
                        }
                    }

                    mainCanvas.width = width;
                    mainCanvas.height = height;

                    // Draw original image to get pixel data
                    ctx.drawImage(img, 0, 0, width, height);
                    originalImageData = ctx.getImageData(0, 0, width, height);

                    // Show canvas, hide placeholder
                    mainCanvas.style.display = 'block';
                    placeholder.style.display = 'none';

                    // Clear and show background
                    ctx.fillStyle = bgColorInput.value;
                    ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

                    // Enable buttons
                    previewBtn.disabled = false;
                    recordBtn.disabled = false;

                    // Hide download section
                    downloadSection.hidden = true;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Create simple scan-line drawing (fallback for when edges are not found)
        function createScanlineStrokes(imageData) {
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            const strokes = [];
            const step = 2;

            // Horizontal scan lines
            for (let y = 0; y < height; y += step) {
                let stroke = [];
                for (let x = 0; x < width; x += 1) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    stroke.push({ x, y, r, g, b, isColor: true });
                }
                if (stroke.length > 0) {
                    strokes.push(stroke);
                }
            }

            return strokes;
        }

        // Animation function
        function animate(recording = false) {
            return new Promise((resolve) => {
                const drawStyle = drawStyleSelect.value;
                const lineWidth = parseInt(lineWidthSlider.value);
                const drawSpeed = parseInt(speedSlider.value);
                const fps = parseInt(fpsSlider.value);
                const frameInterval = 1000 / fps;
                const showHand = showHandSelect.value === 'yes';

                // Generate strokes based on style
                let allStrokes = [];
                let colorStrokes = [];

                console.log('Draw style:', drawStyle);

                if (drawStyle === 'outline' || drawStyle === 'full') {
                    edgePoints = detectEdges(originalImageData);
                    console.log('Edge points found:', edgePoints.length);
                    allStrokes = createStrokes(edgePoints);
                    console.log('Strokes created:', allStrokes.length);

                    // Fallback: if too few strokes, use scanline method
                    if (allStrokes.length < 10) {
                        console.log('Using scanline fallback for outline');
                        allStrokes = createScanlineStrokes(originalImageData);
                    }
                } else if (drawStyle === 'sketch') {
                    allStrokes = createSketchStrokes(originalImageData);
                    console.log('Sketch strokes created:', allStrokes.length);
                } else if (drawStyle === 'paint') {
                    allStrokes = createPaintStrokes(originalImageData);
                    console.log('Paint strokes created:', allStrokes.length);
                }

                if (drawStyle === 'full') {
                    colorStrokes = createPaintStrokes(originalImageData);
                }

                // Flatten strokes into draw commands
                let drawCommands = [];

                for (const stroke of allStrokes) {
                    for (let i = 0; i < stroke.length; i++) {
                        const point = stroke[i];
                        drawCommands.push({
                            x: point.x,
                            y: point.y,
                            r: point.r,
                            g: point.g,
                            b: point.b,
                            isColor: point.isColor || false,
                            strokeStart: i === 0,
                            phase: (drawStyle === 'paint' || point.isColor) ? 'color' : 'outline'
                        });
                    }
                }

                if (drawStyle === 'full') {
                    for (const stroke of colorStrokes) {
                        for (let i = 0; i < stroke.length; i++) {
                            drawCommands.push({
                                ...stroke[i],
                                strokeStart: i === 0,
                                phase: 'color'
                            });
                        }
                    }
                }

                console.log('Total draw commands:', drawCommands.length);

                const totalCommands = drawCommands.length;

                if (totalCommands === 0) {
                    alert('Cizilecek nokta bulunamadi! Farkli bir resim veya ayar deneyin.');
                    isAnimating = false;
                    stopBtn.disabled = true;
                    previewBtn.disabled = false;
                    recordBtn.disabled = false;
                    resolve(false);
                    return;
                }

                let currentIndex = 0;

                // Clear canvas with background color
                ctx.fillStyle = bgColorInput.value;
                ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

                isAnimating = true;
                stopBtn.disabled = false;
                previewBtn.disabled = true;
                recordBtn.disabled = true;

                if (showHand) {
                    handCursor.style.display = 'block';
                }

                let lastFrameTime = 0;
                let lastX = 0, lastY = 0;
                let prevX = null, prevY = null;

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                function frame(timestamp) {
                    if (!isAnimating) {
                        handCursor.style.display = 'none';
                        resolve(false);
                        return;
                    }

                    if (timestamp - lastFrameTime >= frameInterval) {
                        lastFrameTime = timestamp;

                        // Draw commands for this frame
                        const endIndex = Math.min(currentIndex + drawSpeed, totalCommands);

                        for (let i = currentIndex; i < endIndex; i++) {
                            const cmd = drawCommands[i];

                            if (cmd.phase === 'color' || drawStyle === 'paint') {
                                // Color/paint mode - draw colored pixels
                                if (cmd.r !== undefined) {
                                    ctx.fillStyle = `rgb(${cmd.r},${cmd.g},${cmd.b})`;
                                } else {
                                    ctx.fillStyle = penColorInput.value;
                                }
                                ctx.fillRect(cmd.x, cmd.y, drawStyle === 'paint' ? 8 : 2, drawStyle === 'paint' ? 8 : 2);
                            } else {
                                // Outline/sketch mode - draw lines
                                ctx.strokeStyle = penColorInput.value;
                                ctx.lineWidth = lineWidth;

                                if (cmd.strokeStart || prevX === null) {
                                    prevX = cmd.x;
                                    prevY = cmd.y;
                                } else {
                                    ctx.beginPath();
                                    ctx.moveTo(prevX, prevY);
                                    ctx.lineTo(cmd.x, cmd.y);
                                    ctx.stroke();
                                    prevX = cmd.x;
                                    prevY = cmd.y;
                                }
                            }

                            lastX = cmd.x;
                            lastY = cmd.y;
                        }

                        // Update hand cursor position
                        if (showHand && endIndex > 0) {
                            const canvasRect = mainCanvas.getBoundingClientRect();
                            const scaleX = canvasRect.width / mainCanvas.width;
                            const scaleY = canvasRect.height / mainCanvas.height;

                            handCursor.style.left = `${lastX * scaleX + canvasRect.left - mainCanvas.parentElement.getBoundingClientRect().left}px`;
                            handCursor.style.top = `${lastY * scaleY}px`;
                        }

                        currentIndex = endIndex;

                        // Update progress
                        const progress = Math.floor((currentIndex / totalCommands) * 100);
                        progressFill.style.width = `${progress}%`;
                        progressText.textContent = `${progress}%`;

                        // Check if animation is complete
                        if (currentIndex >= totalCommands) {
                            isAnimating = false;
                            stopBtn.disabled = true;
                            previewBtn.disabled = false;
                            recordBtn.disabled = false;
                            handCursor.style.display = 'none';
                            resolve(true);
                            return;
                        }
                    }

                    animationFrameId = requestAnimationFrame(frame);
                }

                progressContainer.hidden = false;
                animationFrameId = requestAnimationFrame(frame);
            });
        }

        // Preview button handler
        previewBtn.addEventListener('click', async () => {
            if (!originalImage) return;
            downloadSection.hidden = true;
            await animate(false);
        });

        // Stop button handler
        stopBtn.addEventListener('click', () => {
            isAnimating = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            handCursor.style.display = 'none';
            stopBtn.disabled = true;
            previewBtn.disabled = false;
            recordBtn.disabled = false;
        });

        // Record button handler
        recordBtn.addEventListener('click', async () => {
            if (!originalImage) return;

            downloadSection.hidden = true;
            recordedChunks = [];
            isRecording = true;

            // Set up MediaRecorder
            const stream = mainCanvas.captureStream(parseInt(fpsSlider.value));

            // Try different codecs
            const mimeTypes = [
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm',
                'video/mp4'
            ];

            let selectedMimeType = '';
            for (const mimeType of mimeTypes) {
                if (MediaRecorder.isTypeSupported(mimeType)) {
                    selectedMimeType = mimeType;
                    break;
                }
            }

            if (!selectedMimeType) {
                alert('Bu tarayici video kaydetmeyi desteklemiyor!');
                isRecording = false;
                return;
            }

            mediaRecorder = new MediaRecorder(stream, {
                mimeType: selectedMimeType,
                videoBitsPerSecond: 5000000
            });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = () => {
                isRecording = false;

                if (recordedChunks.length > 0) {
                    const blob = new Blob(recordedChunks, { type: selectedMimeType });
                    const url = URL.createObjectURL(blob);

                    videoPreview.src = url;
                    downloadBtn.href = url;

                    // Set appropriate file extension
                    const extension = selectedMimeType.includes('mp4') ? 'mp4' : 'webm';
                    downloadBtn.download = `hand-drawing.${extension}`;

                    downloadSection.hidden = false;
                }
            };

            mediaRecorder.start(100);

            const completed = await animate(true);

            if (completed) {
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                }, 500);
            }
        });

        // Update background color preview
        bgColorInput.addEventListener('input', () => {
            if (originalImage && !isAnimating) {
                ctx.fillStyle = bgColorInput.value;
                ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            }
        });
    </script>
</body>
