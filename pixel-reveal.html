<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piksel Reveal Video Oluşturucu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #f39c12, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .upload-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .upload-btn {
            background: linear-gradient(135deg, #e94560, #c62a4a);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .file-name {
            color: #888;
            font-size: 0.9rem;
        }

        .image-preview-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        .image-preview-section h3 {
            color: #2ecc71;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .image-preview {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            border: 2px solid #2ecc71;
            object-fit: contain;
        }

        .controls {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.9rem;
            color: #ccc;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
        }

        .control-group input[type="color"] {
            width: 50px;
            height: 35px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .control-group span {
            font-size: 0.85rem;
            color: #f39c12;
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mainCanvas {
            max-width: 100%;
            display: none;
        }

        .placeholder {
            color: #666;
            font-size: 1.2rem;
            text-align: center;
            padding: 50px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-primary:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
        }

        .btn-secondary:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(155, 89, 182, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-danger:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4);
        }

        .progress-container {
            margin-bottom: 25px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #f39c12, #2ecc71);
            width: 0%;
            transition: width 0.1s;
        }

        #progressText {
            color: #f39c12;
            font-weight: bold;
        }

        .download-section {
            background: rgba(46, 204, 113, 0.1);
            border: 2px solid #2ecc71;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .download-section h3 {
            color: #2ecc71;
            margin-bottom: 15px;
        }

        #videoPreview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .upload-section {
                flex-direction: column;
            }

            .button-group {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Piksel Reveal Video Oluşturucu</h1>
        <p class="subtitle">Resminizi yukleyin, pikseller rastgele sirayla ortaya ciksin!</p>

        <div class="upload-section">
            <label for="imageInput" class="upload-btn">
                Resim Sec
            </label>
            <input type="file" id="imageInput" accept="image/*" hidden>
            <span id="fileName" class="file-name">Henuz dosya secilmedi</span>
        </div>

        <div id="imagePreviewSection" class="image-preview-section" hidden>
            <h3>Secilen Resim:</h3>
            <img id="imagePreview" class="image-preview" alt="Secilen resim">
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="pixelSize">Piksel Boyutu:</label>
                <input type="range" id="pixelSize" min="1" max="20" value="4">
                <span id="pixelSizeValue">4px</span>
            </div>

            <div class="control-group">
                <label for="speed">Hiz (piksel/kare):</label>
                <input type="range" id="speed" min="10" max="1000" value="100" step="10">
                <span id="speedValue">100</span>
            </div>

            <div class="control-group">
                <label for="fps">FPS:</label>
                <input type="range" id="fps" min="10" max="60" value="30">
                <span id="fpsValue">30</span>
            </div>

            <div class="control-group">
                <label for="bgColor">Arka Plan:</label>
                <input type="color" id="bgColor" value="#000000">
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="mainCanvas"></canvas>
            <div id="placeholder" class="placeholder">
                <span>Yukaridan bir resim secin</span>
            </div>
        </div>

        <div class="button-group">
            <button id="previewBtn" class="btn btn-secondary" disabled>
                Onizleme
            </button>
            <button id="recordBtn" class="btn btn-primary" disabled>
                Video Olustur
            </button>
            <button id="stopBtn" class="btn btn-danger" disabled>
                Durdur
            </button>
        </div>

        <div id="progress" class="progress-container" hidden>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <span id="progressText">0%</span>
        </div>

        <div id="downloadSection" class="download-section" hidden>
            <h3>Video Hazir!</h3>
            <video id="videoPreview" controls></video>
            <br><br>
            <a id="downloadBtn" class="btn btn-success" download="pixel-reveal.webm">
                Videoyu Indir
            </a>
        </div>
    </div>

    <script>
        // DOM Elements
        const imageInput = document.getElementById('imageInput');
        const fileName = document.getElementById('fileName');
        const pixelSizeSlider = document.getElementById('pixelSize');
        const pixelSizeValue = document.getElementById('pixelSizeValue');
        const speedSlider = document.getElementById('speed');
        const speedValue = document.getElementById('speedValue');
        const fpsSlider = document.getElementById('fps');
        const fpsValue = document.getElementById('fpsValue');
        const bgColorInput = document.getElementById('bgColor');
        const mainCanvas = document.getElementById('mainCanvas');
        const placeholder = document.getElementById('placeholder');
        const previewBtn = document.getElementById('previewBtn');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const progressContainer = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const downloadSection = document.getElementById('downloadSection');
        const videoPreview = document.getElementById('videoPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const imagePreviewSection = document.getElementById('imagePreviewSection');
        const imagePreviewImg = document.getElementById('imagePreview');

        const ctx = mainCanvas.getContext('2d');

        // State
        let originalImage = null;
        let imageData = null;
        let pixelIndices = [];
        let isAnimating = false;
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let animationFrameId = null;

        // Fisher-Yates shuffle algorithm
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Update slider display values
        pixelSizeSlider.addEventListener('input', () => {
            pixelSizeValue.textContent = `${pixelSizeSlider.value}px`;
        });

        speedSlider.addEventListener('input', () => {
            speedValue.textContent = speedSlider.value;
        });

        fpsSlider.addEventListener('input', () => {
            fpsValue.textContent = fpsSlider.value;
        });

        // Handle image upload
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileName.textContent = file.name;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;

                    // Show image preview
                    imagePreviewImg.src = event.target.result;
                    imagePreviewSection.hidden = false;

                    // Set canvas size to image size
                    mainCanvas.width = img.width;
                    mainCanvas.height = img.height;

                    // Draw original image to get pixel data
                    ctx.drawImage(img, 0, 0);
                    imageData = ctx.getImageData(0, 0, img.width, img.height);

                    // Show canvas, hide placeholder
                    mainCanvas.style.display = 'block';
                    placeholder.style.display = 'none';

                    // Clear and show background
                    ctx.fillStyle = bgColorInput.value;
                    ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

                    // Enable buttons
                    previewBtn.disabled = false;
                    recordBtn.disabled = false;

                    // Hide download section
                    downloadSection.hidden = true;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Generate pixel indices based on pixel size
        function generatePixelIndices() {
            const pixelSize = parseInt(pixelSizeSlider.value);
            const width = mainCanvas.width;
            const height = mainCanvas.height;

            const indices = [];

            for (let y = 0; y < height; y += pixelSize) {
                for (let x = 0; x < width; x += pixelSize) {
                    indices.push({ x, y });
                }
            }

            return shuffleArray(indices);
        }

        // Draw a block of pixels at given position
        function drawPixelBlock(x, y, pixelSize) {
            const width = mainCanvas.width;
            const height = mainCanvas.height;

            for (let dy = 0; dy < pixelSize && y + dy < height; dy++) {
                for (let dx = 0; dx < pixelSize && x + dx < width; dx++) {
                    const px = x + dx;
                    const py = y + dy;
                    const idx = (py * width + px) * 4;

                    const r = imageData.data[idx];
                    const g = imageData.data[idx + 1];
                    const b = imageData.data[idx + 2];
                    const a = imageData.data[idx + 3];

                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${a / 255})`;
                    ctx.fillRect(px, py, 1, 1);
                }
            }
        }

        // Animation function
        function animate(recording = false) {
            return new Promise((resolve) => {
                const pixelSize = parseInt(pixelSizeSlider.value);
                const pixelsPerFrame = parseInt(speedSlider.value);
                const fps = parseInt(fpsSlider.value);
                const frameInterval = 1000 / fps;

                pixelIndices = generatePixelIndices();
                const totalPixels = pixelIndices.length;
                let currentIndex = 0;

                // Clear canvas with background color
                ctx.fillStyle = bgColorInput.value;
                ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

                isAnimating = true;
                stopBtn.disabled = false;
                previewBtn.disabled = true;
                recordBtn.disabled = true;

                let lastFrameTime = 0;

                function frame(timestamp) {
                    if (!isAnimating) {
                        resolve(false);
                        return;
                    }

                    if (timestamp - lastFrameTime >= frameInterval) {
                        lastFrameTime = timestamp;

                        // Draw pixels for this frame
                        const endIndex = Math.min(currentIndex + pixelsPerFrame, totalPixels);

                        for (let i = currentIndex; i < endIndex; i++) {
                            const { x, y } = pixelIndices[i];
                            drawPixelBlock(x, y, pixelSize);
                        }

                        currentIndex = endIndex;

                        // Update progress
                        const progress = Math.floor((currentIndex / totalPixels) * 100);
                        progressFill.style.width = `${progress}%`;
                        progressText.textContent = `${progress}%`;

                        // Check if animation is complete
                        if (currentIndex >= totalPixels) {
                            isAnimating = false;
                            stopBtn.disabled = true;
                            previewBtn.disabled = false;
                            recordBtn.disabled = false;
                            resolve(true);
                            return;
                        }
                    }

                    animationFrameId = requestAnimationFrame(frame);
                }

                progressContainer.hidden = false;
                animationFrameId = requestAnimationFrame(frame);
            });
        }

        // Preview button handler
        previewBtn.addEventListener('click', async () => {
            if (!originalImage) return;
            downloadSection.hidden = true;
            await animate(false);
        });

        // Stop button handler
        stopBtn.addEventListener('click', () => {
            isAnimating = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            stopBtn.disabled = true;
            previewBtn.disabled = false;
            recordBtn.disabled = false;
        });

        // Record button handler
        recordBtn.addEventListener('click', async () => {
            if (!originalImage) return;

            downloadSection.hidden = true;
            recordedChunks = [];
            isRecording = true;

            // Set up MediaRecorder
            const stream = mainCanvas.captureStream(parseInt(fpsSlider.value));

            // Try different codecs
            const mimeTypes = [
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm',
                'video/mp4'
            ];

            let selectedMimeType = '';
            for (const mimeType of mimeTypes) {
                if (MediaRecorder.isTypeSupported(mimeType)) {
                    selectedMimeType = mimeType;
                    break;
                }
            }

            if (!selectedMimeType) {
                alert('Bu tarayici video kaydetmeyi desteklemiyor!');
                isRecording = false;
                return;
            }

            mediaRecorder = new MediaRecorder(stream, {
                mimeType: selectedMimeType,
                videoBitsPerSecond: 5000000
            });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = () => {
                isRecording = false;

                if (recordedChunks.length > 0) {
                    const blob = new Blob(recordedChunks, { type: selectedMimeType });
                    const url = URL.createObjectURL(blob);

                    videoPreview.src = url;
                    downloadBtn.href = url;

                    // Set appropriate file extension
                    const extension = selectedMimeType.includes('mp4') ? 'mp4' : 'webm';
                    downloadBtn.download = `pixel-reveal.${extension}`;

                    downloadSection.hidden = false;
                }
            };

            mediaRecorder.start(100);

            const completed = await animate(true);

            if (completed) {
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                }, 500);
            }
        });

        // Update background color preview
        bgColorInput.addEventListener('input', () => {
            if (originalImage && !isAnimating) {
                ctx.fillStyle = bgColorInput.value;
                ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            }
        });
    </script>
</body>
</html>
