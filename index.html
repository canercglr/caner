<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piksel Reveal Video Oluşturucu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎬 Piksel Reveal Video Oluşturucu</h1>
        <p class="subtitle">Resminizi yükleyin, pikseller rastgele sırayla ortaya çıksın!</p>

        <div class="upload-section">
            <label for="imageInput" class="upload-btn">
                📁 Resim Seç
            </label>
            <input type="file" id="imageInput" accept="image/*" hidden>
            <span id="fileName" class="file-name">Henüz dosya seçilmedi</span>
        </div>

        <div id="imagePreviewSection" class="image-preview-section" hidden>
            <h3>📷 Seçilen Resim:</h3>
            <img id="imagePreview" class="image-preview" alt="Seçilen resim">
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="pixelSize">Piksel Boyutu:</label>
                <input type="range" id="pixelSize" min="1" max="20" value="4">
                <span id="pixelSizeValue">4px</span>
            </div>

            <div class="control-group">
                <label for="speed">Hız (piksel/kare):</label>
                <input type="range" id="speed" min="10" max="1000" value="100" step="10">
                <span id="speedValue">100</span>
            </div>

            <div class="control-group">
                <label for="fps">FPS:</label>
                <input type="range" id="fps" min="10" max="60" value="30">
                <span id="fpsValue">30</span>
            </div>

            <div class="control-group">
                <label for="bgColor">Arka Plan:</label>
                <input type="color" id="bgColor" value="#000000">
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="mainCanvas"></canvas>
            <div id="placeholder" class="placeholder">
                <span>👆 Yukarıdan bir resim seçin</span>
            </div>
        </div>

        <div class="button-group">
            <button id="previewBtn" class="btn btn-secondary" disabled>
                ▶️ Önizleme
            </button>
            <button id="recordBtn" class="btn btn-primary" disabled>
                🎥 Video Oluştur
            </button>
            <button id="stopBtn" class="btn btn-danger" disabled>
                ⏹️ Durdur
            </button>
        </div>

        <div id="progress" class="progress-container" hidden>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <span id="progressText">0%</span>
        </div>

        <div id="downloadSection" class="download-section" hidden>
            <h3>✅ Video Hazır!</h3>
            <video id="videoPreview" controls></video>
            <a id="downloadBtn" class="btn btn-success" download="pixel-reveal.webm">
                ⬇️ Videoyu İndir
            </a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
